<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼음왕관의 시련 (베타) - 와우풍 로그라이크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud" class="hidden">
    <div id="playerFrame">
      <div class="portrait"><img src="assets/icons/classmage.jpg" alt=""><div id="pfLevel" class="lvbadge">1</div></div>
      <div class="pfBody">
        <div class="pfName">냉기 마법사</div>
        <div class="bar hp"><div id="pfHp" class="fill"></div><div id="pfAbs" class="absorb"></div><span id="pfHpText"></span></div>
        <div class="bar mana"><div id="pfIcicle" class="fill"></div><span id="pfIcicleText"></span></div>
      </div>
    </div>
    <div id="buffs"></div>
    <div id="topInfo"><div id="timer">00:00</div><div id="subInfo"><span id="kills">0</span> 처치 · <span id="goldTxt">0</span> 골드</div></div>
    <div id="bossFrame" class="hidden">
      <div class="portrait"><img id="bfIcon" src="" alt=""></div>
      <div class="bfBody">
        <div class="bfName"><span id="bfName"></span><span id="bfPct"></span></div>
        <div class="bar bhp"><div id="bfHp" class="fill"></div></div>
        <div id="bfCast" class="bcast hidden"><div class="fill"></div><span></span></div>
      </div>
    </div>
    <div id="raidWarn"></div>
    <div id="castbar" class="hidden"><div class="fill"></div><span class="name"></span><span class="time"></span><div class="spark"></div></div>
    <div id="bottom">
      <div id="rowTop">
        <div id="autoBar"></div>
        <div id="passiveBar"></div>
      </div>
      <div id="actionBar"></div>
      <div id="xpBar"><div class="fill"></div><span></span></div>
    </div>
    <div id="meter" class="hidden">
      <div class="mTitle">Details! <small>피해량</small><span class="mHint">TAB</span></div>
      <div id="meterRows"></div>
    </div>
  </div>

  <div id="modal" class="hidden"></div>
  <div id="tooltip" class="hidden"></div>
  <div id="flash"></div>
</div>
<div id="errlog"></div>

<script src="js/util.js"></script>
<script src="js/assets.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/sprites_classic.js"></script>
<script src="js/data/skills.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/talents.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/stages.js"></script>
<script src="js/combat.js"></script>
<script src="js/player.js"></script>
<script src="js/skills.js"></script>
<script src="js/classes/mage.js"></script>
<script src="js/classes/warlock.js"></script>
<script src="js/enemies.js"></script>
<script src="js/waves.js"></script>
<script src="js/upgrades.js"></script>
<script src="js/meta.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
<script src="js/lobby.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
</body>
</html>
