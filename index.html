<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼음왕관의 시련</title>
<!-- 지금 서비스는 베타 서버(나스). 이 페이지는 3초 뒤 베타로 보내고, 구버전은 /classic/ 에 그대로 둔다. -->
<meta http-equiv="refresh" content="3;url=https://Godlovesyou.synology.me:10443/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #ffd100; --line: #6b5420; --bg: #05070c; --text: #dfe8f5; --dim: #8a93a6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at top, #13213a, var(--bg) 70%); color: var(--text); font-family: 'Noto Sans KR', sans-serif; }
  main { width: 100%; max-width: 520px; text-align: center; padding: 32px 24px; border: 2px solid var(--line); border-radius: 8px;
    background: linear-gradient(rgba(14,18,32,.95), rgba(6,8,16,.95)); box-shadow: 0 10px 40px #000; }
  h1 { font-family: 'Noto Serif KR', serif; font-size: clamp(34px, 9vw, 52px); margin: 0; color: #dff3ff; text-shadow: 0 0 22px #3fa7ff, 3px 3px 0 #000; }
  .beta { display: inline-block; margin: 10px 0 18px; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #000;
    background: linear-gradient(var(--gold), #e08a00); border-radius: 3px; padding: 2px 10px; }
  p { color: var(--dim); line-height: 1.6; margin: 0 0 20px; }
  a.btn { display: block; margin: 10px auto; padding: 12px 0; max-width: 300px; font-weight: 700; color: var(--gold); text-decoration: none;
    background: linear-gradient(#8c1a12, #4a0905); border: 2px solid #c9a24a; border-radius: 4px; }
  a.btn:hover { filter: brightness(1.25); }
  a.sub { color: var(--dim); font-size: 14px; }
  #count { color: var(--gold); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>얼음왕관의 시련</h1>
  <div class="beta">BETA v2.0.0-beta.1</div>
  <p>새 버전이 베타로 열렸습니다. 계정 · 오리지널 던전과 공격대 · 흑마법사 · 장비와 특성 · 랭킹을 즐겨 보세요.<br>
     <span id="count">3</span>초 뒤 베타 서버로 이동합니다.</p>
  <a class="btn" href="https://Godlovesyou.synology.me:10443/">베타 바로 플레이</a>
  <a class="sub" href="classic/" id="classic">이전 버전(클래식) 플레이 — 기존 기록은 그대로 남아 있습니다</a>
</main>
<script>
  // 클래식을 누르면 자동 이동을 멈춘다
  let n = 3, timer = setInterval(() => { n--; document.getElementById('count').textContent = Math.max(0, n); }, 1000);
  document.getElementById('classic').addEventListener('click', () => { clearInterval(timer); window.stop && window.stop(); });
</script>
</body>
</html>
